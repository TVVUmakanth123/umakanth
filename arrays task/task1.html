<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const movies = [
            { id: 1, title: "Bahubali", rating: 9 },
            { id: 2, title: "Pushpa", rating: 8 },
            { id: 3, title: "RRR", rating: 10 },
            { id: 4, title: "Salaar", rating: 7 }
        ];
        console.log(movies);

        // 1. Create a new array containing only movie titles
        const movieTitles = movies.map(movie => movie.title);
        console.log("Movie Titles:", movieTitles);





        // 2. Create a new array containing only movie ratings
        const movieRatings = movies.map(movie => movie.rating);
        console.log("Movie Ratings:", movieRatings);





        // 3. Increase every movie rating by 1
        const increasedRatings = movies.map(movie =>  movie.rating + 1);
        console.log("Increased Ratings:", increasedRatings);





        // 4. Get all movies with rating greater than 8
        const ratingGreaterThan8 = movies.filter(movie => movie.rating > 8);
        console.log("Movies with Rating > 8:", ratingGreaterThan8);





        // 5. Get all movies with rating less than 9
        const ratingLessThan9 = movies.filter(movie => movie.rating < 9);
        console.log("Movies with Rating < 9:", ratingLessThan9);





        // 6. Find the movie with ID 3
        const movieById = movies.find(movie => movie.id === 3);
        console.log("Movie with ID 3:", movieById);





        // 7. Find the movie with title "Pushpa"
        const movieByTitle = movies.find(movie => movie.title === "Pushpa");
        console.log('Movie with Title "Pushpa":', movieByTitle);





        // 8. Calculate the total of all movie ratings
        const totalRatings = movies.reduce((total, movie) => total + movie.rating, 0);
        console.log("Total Ratings: " + totalRatings);
    </script>
</body>

</html>
