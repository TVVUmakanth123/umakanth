<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const scores = [45, 80, 20, 100, 60];
        console.log(scores);

        // 17. Add 10 runs to every score
        const add10Runs = scores.map(score => score + 10);
        console.log("Add 10 Runs:", add10Runs);





        // 18. Add 5 runs to every score
        const add5Runs = scores.map(score => score + 5);
        console.log("Add 5 Runs:", add5Runs);





        // 19. Get all scores greater than 50
        const greaterThan50 = scores.filter(score => score > 50);
        console.log("Scores Greater Than 50:", greaterThan50);





        // 20. Get all scores greater than or equal to 80
        const greaterOrEqual80 = scores.filter(score => score >= 80);
        console.log("Scores Greater Than or Equal to 80:", greaterOrEqual80);





        // 21. Find the first score greater than 70
        const firstGreaterThan70 = scores.find(score => score > 70);
        console.log("First Score Greater Than 70:", firstGreaterThan70);





        // 22. Find the first score equal to 100
        const firstEqual100 = scores.find(score => score === 100);
        console.log("First Score Equal to 100:", firstEqual100);





        // 23. Calculate the total runs scored
        const totalRuns = scores.reduce((total, score) => total + score, 0);
        console.log("Total Runs:", totalRuns);





        // 24. Calculate the average score
        const averageScore = totalRuns / scores.length;
        console.log("Average Score:", averageScore);
    </script>
</body>

</html>
