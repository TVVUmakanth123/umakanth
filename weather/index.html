<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Weather Report</h1>
        <input type="text" id="city" placeholder="Enter City Name">
        <button onclick="getWeather()">Search</button>
        <div id="result">
            <h2 id="cityName"></h2>
            <p id="temp"></p>
            <p id="weather"></p>
            <p id="humidity"></p>
            <p id="wind"></p>
        </div>
    </div>
    <script>
        async function getWeather() {
            let city = document.getElementById("city").value;
            let apiKey = "879d9e8fafcaa1e27fa527cf9423b5c0";
            let url = "https://api.openweathermap.org/data/2.5/weather?q=" + city + "&appid=" + apiKey + "&units=metric";
            try {
                let response = await fetch(url);
                let data = await response.json();
                document.getElementById("cityName").innerHTML = data.name;
                document.getElementById("temp").innerHTML = "Temperature : " + data.main.temp + " °C";
                document.getElementById("weather").innerHTML = "Weather : " + data.weather[0].main;
                document.getElementById("humidity").innerHTML = "Humidity : " + data.main.humidity + "%";
                document.getElementById("wind").innerHTML = "Wind Speed : " + data.wind.speed + " m/s";
            }
            catch (error) {
                alert("Something went wrong!");
            }
        }
    </script>
</body>

</html>
