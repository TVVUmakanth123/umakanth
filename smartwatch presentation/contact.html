<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            Sonar
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="Secifications.html">Specifications</a></li>
                <li><a href="design.html">Design</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="Retailers.html">Retailers</a></li>
            </ul>
        </nav>
    </header>
    <section class="hero">
        <img src="contact-title-image.jpg" alt="">
    </section>
    <section class="contact-section">
        <div class="container">
            <h1>Get In Touch</h1>
            <div class="top-boxes">
                <div class="top-card">
                    <span>Manual and downloadable content</span>
                    <div class="circle-btn">
                        <i class="fa-solid fa-angle-right"></i>
                    </div>
                </div>
                <div class="top-card">
                    <span>Live Chat</span>
                    <div class="circle-btn">
                        <i class="fa-solid fa-angle-right"></i>
                    </div>
                </div>
            </div>
            <div class="contact-content">
                <div class="contact-left">
                    <p>
                        1608 Kelley Road, Gulfport, MS <br>
                        Mississippi 39501, USA
                    </p>
                    <div class="phone-numbers">
                        <p>228-566-6312</p>
                        <p>601-868-9017</p>
                    </div>
                </div>
                <div class="contact-right">
                    <form>
                        <input type="email" placeholder="Email*" required>
                        <input type="text" placeholder="Name*" required>
                        <textarea placeholder="Text Message*" required></textarea>
                        <button type="submit">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <footer>
        <div class="footer-container">
            <div class="footer-left">
                <div class="footer-logo">
                    Sonar
                </div>
                <div class="footer-links">
                    <a href="#">Company</a>
                    <a href="#">Contact</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Use</a>
                </div>
            </div>
            <div class="footer-right">
                <span>Follow us:</span>
                <div class="social-icons">
                    <a href="#">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="#">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a href="#">
                        <i class="fa-brands fa-twitter"></i>
                    </a>
                    <a href="#">
                        <i class="fa-brands fa-youtube"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
