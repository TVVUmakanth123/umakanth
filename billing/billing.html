<!DOCTYPE html>
<html>

<head>
    <title>Simple Billing System</title>
    <link rel="stylesheet" href="billing.css">
</head>

<body>

    <div class="container">
        <h1>Simple Billing System</h1>

        <input type="text" id="productName" placeholder="Product Name">
        <input type="number" id="price" placeholder="Price">
        <input type="number" id="quantity" placeholder="Quantity">

        <button onclick="addProduct()">Add Product</button>

        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <div class="summary">
            <h3>Total Products: <span id="totalProducts">0</span></h3>
            <h3>Grand Total: <span id="grandTotal">0</span>rs.</h3>
            <h3>Average Cost per Product: <span id="averageCost">0</span>rs.</h3>
        </div>
    </div>




    <script>
        let products = [];
        function addProduct() {
            let name = document.getElementById("productName").value;
            let price = Number(document.getElementById("price").value);
            let quantity = Number(document.getElementById("quantity").value);
            if (name == "" || price <= 0 || quantity <= 0) {
                alert("Enter valid details");
                return;
            }
            let total = price * quantity;
            let product = {
                productName: name,
                price: price,
                quantity: quantity,
                total: total
            };
            products.push(product);
            displayData();
            document.getElementById("productName").value = "";
            document.getElementById("price").value = "";
            document.getElementById("quantity").value = "";
        }
        function displayData() {
            let table = document.getElementById("tableBody");
            table.innerHTML = "";
            let grandTotal = 0;
            for (let i = 0; i < products.length; i++) {
                grandTotal = grandTotal + products[i].total;
                table.innerHTML += `<tr>
                    <td>${products[i].productName}</td>
                    <td>${products[i].price}</td>
                    <td>${products[i].quantity}</td>
                    <td>${products[i].total}</td>
                    <td><button onclick="deleteProduct(${i})"> Delete</button></td>
                    </tr>`;
            }
            document.getElementById("totalProducts").innerHTML = products.length;
            document.getElementById("grandTotal").innerHTML = grandTotal;
            let average = 0;
            if (products.length > 0) {
                average = grandTotal / products.length;
            }
            document.getElementById("averageCost").innerHTML = average.toFixed(2);
        }
        function deleteProduct(index) {
            products.splice(index, 1);
            displayData();
        }
    </script>


</body>

</html>
