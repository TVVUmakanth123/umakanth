<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>data types</h1>
    <h2>strings</h2>
    <p id="demo">kanth</p>



    <script>
        let x='uma';
        let y='kanth';

        document.getElementById("demo").innerHTML = x+y;

        var a=10, b=5;

        //Arithematical
        console.log(a+b);
        console.log(a-b);
        console.log(a*b);
        console.log(a/b);
        console.log(a%b);
        
        //Assignment
        a+=b;
        console.log(a);
        a-=b;
        console.log(a);
        a*=b;
        console.log(a);
        a/=b;
        console.log(a);
        a%=b;
        console.log(a);
        

        //increment/decrement
        let m=10;
        console.log(m);
        m++;
        console.log(m);
        m--;
        console.log(m);


        //Relational
        console.log(a==b);
        console.log(a!=b);
        console.log(a<b);
        console.log(a>b);
        console.log(a<=b);
        console.log(a>=b);


        //Logical
        c=6;
        console.log(a<b&&b<c);
        console.log(a<b||b<c);
        console.log(!b<c);


        //concatenation
        var d='uma';
        var e='kanth';

        console.log(a);
        console.log(b);
        console.log(a+b);
        console.log(d+e);
        console.log(b+e);
        console.log(e+b);
    </script>
</body>
</html>
