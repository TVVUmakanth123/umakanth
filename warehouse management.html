<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>SMART WAREHOUSE MANAGEMENT SYSTEM</h1>
    <script>
        const products = [
            {
                name: "  wireless mouse ",
                category: "electronics",
                quantity: 25,
                price: 799
            },
            {
                name: "Gaming Keyboard",
                category: "ELECTRONICS",
                quantity: 8,
                price: 2499
            },
            {
                name: "office chair",
                category: "furniture",
                quantity: 3,
                price: 5999
            },
            {
                name: "LED Monitor",
                category: "Electronics",
                quantity: 15,
                price: 10999
            },
            {
                name: "water bottle",
                category: "home",
                quantity: 50,
                price: 299
            }
        ];


        //1. CLEAN PRODUCT NAMES
        let cleanName1 = products[0].name.trim();
        console.log(cleanName1);

        let cleanName2 = products[1].name.trim();
        console.log(cleanName2);





        //2. CONVERT CATEGORY TO UPPERCASE
        console.log(products[0].category.toUpperCase());
        console.log(products[1].category.toUpperCase());
        console.log(products[2].category.toUpperCase());
        console.log(products[3].category.toUpperCase());
        console.log(products[4].category.toUpperCase());





        //3. INVENTORY VALUE
        let value1 = products[0].quantity * products[0].price;
        console.log(value1);

        let value2 = products[1].quantity * products[1].price;
        console.log(value2);

        let value3 = products[2].quantity * products[2].price;
        console.log(value3);





        //4. STOCK STATUS
        if (products[0].quantity > 20) {
            console.log("HIGH STOCK");
        }
        else if (products[0].quantity >= 10) {
            console.log("MEDIUM STOCK");
        }
        else {
            console.log("LOW STOCK");
        }




        //5. TOTAL PRODUCTS
        console.log(products.length);





        //6. TOTAL INVENTORY VALUE
        let total =
            (products[0].quantity * products[0].price) +
            (products[1].quantity * products[1].price) +
            (products[2].quantity * products[2].price) +
            (products[3].quantity * products[3].price) +
            (products[4].quantity * products[4].price);
        console.log(total);





        //7. AVERAGE PRICE
        let average =
            (products[0].price +
                products[1].price +
                products[2].price +
                products[3].price +
                products[4].price) / products.length;

        console.log(average);





        //8. MOST EXPENSIVE PRODUCT
        let expensive = products[0];
        for (let i = 1; i < products.length; i++) {
            if (products[i].price > expensive.price) {
                expensive = products[i];
            }
        }
        console.log("Most Expensive Product:");
        console.log(expensive.name);
        console.log("Price: " + expensive.price);




        //9. CHEAPEST PRODUCT
        let cheap = products[0];
        for (let i = 1; i < products.length; i++) {
            if (products[i].price < cheap.price) {
                cheap = products[i];
            }
        }
        console.log("Cheapest Product:");
        console.log(cheap.name);
        console.log("Price: ₹" + cheap.price);





        //10. PRODUCT WITH HIGHEST QUANTITY
        let highQty = products[0];
        for (let i = 1; i < products.length; i++) {
            if (products[i].quantity > highQty.quantity) {
                highQty = products[i];
            }
        }
        console.log("Highest Quantity Product:");
        console.log(highQty.name);
        console.log("Quantity: " + highQty.quantity);





        //11. PRODUCT WITH LOWEST QUANTITY
        let lowQty = products[0];
        for (let i = 1; i < products.length; i++) {
            if (products[i].quantity < lowQty.quantity) {
                lowQty = products[i];
            }
        }
        console.log("Lowest Quantity Product:");
        console.log(lowQty.name);
        console.log("Quantity: " + lowQty.quantity);





        //12. SEARCH FEATURE
        const keyword = "ele";
        console.log(products[0].category.toLowerCase().includes(keyword));
        console.log(products[1].category.toLowerCase().includes(keyword));






        //13. SORT PRICE (HIGH TO LOW)
        for (let i = 0; i < products.length; i++) {
            for (let j = i + 1; j < products.length; j++) {
                if (products[i].price < products[j].price) {
                    let temp = products[i];
                    products[i] = products[j];
                    products[j] = temp;
                }
            }
        }
        console.log("Price High to Low:");
        for (let i = 0; i < products.length; i++) {
            console.log(products[i].name + " - " + products[i].price);
        }





        //14. SORT QUANTITY (LOW TO HIGH)
        for (let i = 0; i < products.length; i++) {
            for (let j = i + 1; j < products.length; j++) {
                if (products[i].quantity > products[j].quantity) {
                    let temp = products[i];
                    products[i] = products[j];
                    products[j] = temp;
                }
            }
        }
        console.log("Quantity Low to High:");
        for (let i = 0; i < products.length; i++) {
            console.log(products[i].name + " - " + products[i].quantity);
        }





        //15. TOP 3 COSTLIEST PRODUCTS 
            for(let i = 0; i < products.length; i++) {
            for (let j = i + 1; j < products.length; j++) {
                if (products[i].price < products[j].price) {
                    let temp = products[i];
                    products[i] = products[j];
                    products[j] = temp;
                }
            }
        }
        console.log("Top 3 Costliest Products:");
        for (let i = 0; i < 3; i++) {
            console.log(products[i].name);
            console.log("Price: ₹" + products[i].price);
        }





        //16. LOW STOCK ALERT
        if (products[2].quantity < 5) {
            console.log("WARNING: Office Chair stock is critically low");
        }





        //17. CATEGORY SUMMARY
        let electronics = 0;
        let furniture = 0;
        let home = 0;
        for (let i = 0; i < products.length; i++) {
            let cat = products[i].category.toUpperCase();
            if (cat == "ELECTRONICS") {
                electronics++;
            }
            else if (cat == "FURNITURE") {
                furniture++;
            }
            else if (cat == "HOME") {
                home++;
            }
        }
        console.log("ELECTRONICS :", electronics);
        console.log("FURNITURE :", furniture);
        console.log("HOME :", home);




        //18. STOCK VISUALIZATION
        console.log("Wireless Mouse " + "#".repeat(products[0].quantity));
        console.log("Gaming Keyboard " + "#".repeat(products[1].quantity));
        console.log("Office Chair " + "#".repeat(products[2].quantity));
    </script>
</body>

</html>
